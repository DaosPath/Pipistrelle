services:
  pipistrelle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipistrelle_broker
    command: ["--cert", "/app/config/cert.pem", "--key", "/app/config/key.pem"]
    restart: unless-stopped
    ports:
      - "1883:1883" # Plain TCP MQTT
      - "8883:8883" # Secure TLS MQTT
      - "8083:8083" # WebSockets MQTT
      - "9095:9090" # Prometheus Metrics Exporter
    environment:
      PIPISTRELLE_PORT_TCP: "1883"
      PIPISTRELLE_PORT_TLS: "8883"
      PIPISTRELLE_PORT_WS: "8083"
      PIPISTRELLE_PORT_METRICS: "9090"
      PIPISTRELLE_LOG_LEVEL: "${PIPISTRELLE_LOG_LEVEL:-info}"
      PIPISTRELLE_MAX_AUTH_CONCURRENCY: "${PIPISTRELLE_MAX_AUTH_CONCURRENCY:-4}"
      PIPISTRELLE_CLIENT_QUEUE_CAPACITY: "${PIPISTRELLE_CLIENT_QUEUE_CAPACITY:-1024}"
      PIPISTRELLE_MAX_SUBSCRIPTIONS_PER_CLIENT: "${PIPISTRELLE_MAX_SUBSCRIPTIONS_PER_CLIENT:-256}"
      PIPISTRELLE_SLOW_CONSUMER_POLICY: "${PIPISTRELLE_SLOW_CONSUMER_POLICY:-backpressure}"
      PIPISTRELLE_SLOW_CONSUMER_TIMEOUT_MS: "${PIPISTRELLE_SLOW_CONSUMER_TIMEOUT_MS:-5000}"
      PIPISTRELLE_BRIDGE_QUEUE_CAPACITY: "${PIPISTRELLE_BRIDGE_QUEUE_CAPACITY:-4096}"
      PIPISTRELLE_BRIDGE_QUEUE_POLICY: "${PIPISTRELLE_BRIDGE_QUEUE_POLICY:-drop-newest}"
      PIPISTRELLE_LATENCY_SAMPLE_RATE: "${PIPISTRELLE_LATENCY_SAMPLE_RATE:-64}"
      PIPISTRELLE_DB_PATH: /app/data/pipistrelle.db
      PIPISTRELLE_CREDENTIALS_PATH: /app/config/credentials.json
      PIPISTRELLE_ALLOW_ANONYMOUS: "${PIPISTRELLE_ALLOW_ANONYMOUS:-false}"
      PIPISTRELLE_TLS_PROFILE: "${PIPISTRELLE_TLS_PROFILE:-hybrid}"
      PIPISTRELLE_BRIDGE_TLS_PROFILE: "${PIPISTRELLE_BRIDGE_TLS_PROFILE:-hybrid}"
      PIPISTRELLE_BRIDGE_HOST: "${PIPISTRELLE_BRIDGE_HOST:-}"
      PIPISTRELLE_BRIDGE_USER: "${PIPISTRELLE_BRIDGE_USER:-}"
      PIPISTRELLE_BRIDGE_PASS: "${PIPISTRELLE_BRIDGE_PASS:-}"
      PIPISTRELLE_BRIDGE_PORT: "${PIPISTRELLE_BRIDGE_PORT:-8883}"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    working_dir: /app
