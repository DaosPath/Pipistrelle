[package]
name = "pipistrelle"
version = "2.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-pki-types = "1.7"
rustls-pemfile = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-tungstenite = { version = "0.21", features = ["handshake"] }
pin-project = "1.1"
rcgen = "0.13"
futures-util = "0.3"
webpki-roots = "0.26"


